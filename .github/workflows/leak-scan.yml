# Generated by `repo-aegis install ci` (profile: pr).
#
# The blocking gate. Runs on every PR, every push to a default branch, every
# tag, and on the `public` event. Regenerate with `repo-aegis install ci
# --profile pr --write --force`; edit it and `install ci --uninstall` will
# refuse to delete it (it only removes files it recognises byte-for-byte).
#
# Three flags below are deliberate and worth understanding before you change
# them:
#
#   --no-hooks-check  Do NOT remove. It skips the git-hooks liveness check,
#                     which verifies repo-aegis's pre-commit/pre-push hooks are
#                     wired via core.hooksPath. A CI runner checks out a fresh
#                     clone with no hooks installed, so the check would fail on
#                     every run — a guaranteed false positive. Hook liveness is
#                     a developer-machine concern; `repo-aegis doctor` sweeps
#                     for it across your repos.
#
#   --min-patterns 0  This repo is configured to scan with NO deny set, so an
#                     empty one is not an error here. That is correct only when
#                     the repo genuinely has no engagement markers reachable
#                     from CI — a public OSS repo, or one whose registry is
#                     machine-local and deliberately not shipped to a runner.
#                     Note what it costs: the marker scan reports
#                     `skipped: empty deny set` and only the deny-set-
#                     INDEPENDENT checks (lockfile/private-registry egress,
#                     visibility) actually do work. Once a registry is
#                     reachable from CI, regenerate without
#                     --no-require-deny-set to get the real gate back.
#
#   REPO_AEGIS_REDACT_ATTRIBUTION  Strips engagement ids from output. A job log
#                     on a public repo is world-readable, and an engagement id
#                     is usually the customer's name. Findings keep file, line,
#                     and counts, which is what makes them actionable.
name: leak-scan

on:
  pull_request:
  push:
    branches: [main, master]
    # A tag can introduce content no branch push ever carried, and the local
    # pre-push hook reads possibly-stale remote-tracking refs. Here the remote
    # state is authoritative.
    tags: ['**']
  # Fires when a repo flips private -> public: the one moment the threat model
  # changes wholesale. Everything previously safe-because-private is now not.
  public:

permissions:
  contents: read

concurrency:
  group: leak-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # CI knows this repo's visibility authoritatively; a fresh clone has no
      # cached value for the egress check to read. The variable is
      # one-directional by design — it can assert "public" (which turns
      # private-registry egress enforcement ON) and there is no counterpart
      # that asserts "private", because an env var that switches findings off
      # is a waiver nobody reviewed.
      REPO_AEGIS_ASSUME_PUBLIC: ${{ github.event.repository.private == false && '1' || '0' }}
      REPO_AEGIS_REDACT_ATTRIBUTION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The scan never pushes. Leaving the token in .git/config only
          # widens what a later step (or an uploaded artifact) could expose.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '24'
      - name: Install repo-aegis
        # Installed from outside the checkout so a PR-supplied .npmrc
        # cannot repoint the registry, with scripts disabled and the
        # registry stated explicitly. See doc/github-action.md.
        working-directory: ${{ runner.temp }}
        env:
          REPO_AEGIS_VERSION: '0.8.2'
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g --ignore-scripts --registry=https://registry.npmjs.org \
            "@de-otio/repo-aegis@${REPO_AEGIS_VERSION}"
      - name: Marker scan
        # One process for the whole repo, not one per file: audit's JSON
        # enumerates findings with file:line, so a non-zero exit already
        # identifies the offending file. --verbose is never passed here — a CI
        # log is no more private than a PR comment.
        #
        # The lockfile/egress check is ON (it was off in pre-0.8.0 templates):
        # a private-registry URL in a lockfile leaks an account id and breaks
        # `npm ci` for external clones, and REPO_AEGIS_ASSUME_PUBLIC above is
        # what lets it decide correctly on a fresh checkout.
        run: |
          repo-aegis audit --json \
            --min-patterns 0 \
            --no-fixture-check \
            --no-remote-check \
            --no-hooks-check

  # A new ref can carry content no branch push ever showed. `check --push-ref`
  # normally derives its range from remote-tracking refs, which a local hook
  # can never refresh; on a runner they are as fresh as the fetch, and a
  # missing tracking ref degrades to a full-history scan — an over-scan, never
  # an under-scan.
  new-ref-scan:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REPO_AEGIS_ASSUME_PUBLIC: ${{ github.event.repository.private == false && '1' || '0' }}
      REPO_AEGIS_REDACT_ATTRIBUTION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '24'
      - name: Install repo-aegis
        # Installed from outside the checkout so a PR-supplied .npmrc
        # cannot repoint the registry, with scripts disabled and the
        # registry stated explicitly. See doc/github-action.md.
        working-directory: ${{ runner.temp }}
        env:
          REPO_AEGIS_VERSION: '0.8.2'
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g --ignore-scripts --registry=https://registry.npmjs.org \
            "@de-otio/repo-aegis@${REPO_AEGIS_VERSION}"
      - name: Scan the pushed ref
        run: repo-aegis check --push-ref "$GITHUB_REF" --json --min-patterns 0

  # Guards the gate's own configuration. A PR that adds a waiver or a path
  # exemption in the same change as the content it unblocks is the normal
  # shape, not an exotic one: the person adding the waiver is the person the
  # gate just blocked.
  #
  # IMPORTANT — this job cannot protect itself. On `pull_request`, GitHub runs
  # the workflow from the PR's own ref, so a PR can delete this job and it
  # simply never runs. What makes it enforceable is a REQUIRED STATUS CHECK
  # registered by name in the repository ruleset: a deleted or renamed job then
  # reads as "expected but never received" and blocks the merge. Add
  # `config-guard` to your required checks, and put `.repo-aegis.yml` and
  # `.github/` under CODEOWNERS. Without that, this job is advisory only.
  config-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REPO_AEGIS_REDACT_ATTRIBUTION: '1'
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes to the gate's configuration
        id: detect
        # BASE_REF comes in via env, never spliced into the script: a branch
        # name is attacker-controlled on a fork PR.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only FETCH_HEAD...HEAD -- \
            .repo-aegis.yml '.github/workflows/leak-scan*.yml' || true)
          if [ -n "$changed" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "This PR modifies the leak gate's own configuration:"
            echo "$changed"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.detect.outputs.touched == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '24'
      - name: Install repo-aegis
        # Installed from outside the checkout so a PR-supplied .npmrc
        # cannot repoint the registry, with scripts disabled and the
        # registry stated explicitly. See doc/github-action.md.
        working-directory: ${{ runner.temp }}
        env:
          REPO_AEGIS_VERSION: '0.8.2'
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g --ignore-scripts --registry=https://registry.npmjs.org \
            "@de-otio/repo-aegis@${REPO_AEGIS_VERSION}"
      - name: Re-scan with every suppression ignored
        if: steps.detect.outputs.touched == 'true'
        # Reports what the proposed configuration would hide. Exit 1 here means
        # the change suppresses a real finding — which may be entirely correct,
        # and is exactly the decision a human reviewer should be making.
        #
        # There is no --ignore-waivers here because `audit` never applies
        # waivers at all (unlike `check`), so it is already strict in that
        # dimension. `repo-aegis: allow` comments it DOES respect, which is
        # what --ignore-allowlist-comments turns off.
        run: |
          repo-aegis audit --json \
            --min-patterns 0 \
            --ignore-allowlist-comments \
            --no-hooks-check
