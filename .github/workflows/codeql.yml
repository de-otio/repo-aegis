# SPDX-License-Identifier: GPL-3.0-or-later
# GitHub CodeQL — static analysis. Runs on PRs targeting main, on
# push to main, and weekly to catch advisories that land on already-
# merged code.
#
# The "javascript-typescript" language covers both — CodeQL handles
# them under one analysis pipeline since the v3 action.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC

# Cancel superseded PR runs; let push/scheduled runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the workflow level; the write scope is granted only to
# the job that actually uploads results.
permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  # Aggregator: stable check-run name for branch-protection. The
  # matrix expands `analyze` into ugly doubled names like
  # `analyze (javascript-typescript) (javascript-typescript)`, which
  # we don't want to pin in the ruleset.
  codeql-success:
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify analyze job succeeded
        env:
          # Via env, not spliced into the script. These particular values are
          # GitHub-computed booleans and cannot be attacker-influenced, but the
          # "no ${{ }} inside run:" rule is only enforceable if it is
          # unconditional — an exception here is an exception someone copies.
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "CodeQL analyze did not succeed."
            exit 1
          fi
