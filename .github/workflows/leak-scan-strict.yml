# Generated by `repo-aegis install ci` (profile: strict).
#
# The scheduled conscience. The PR gate has to honour waivers and
# `repo-aegis: allow` comments or it would be unusable — which means the set
# of suppressions is invisible in the only place anyone looks. Suppression
# creep is how a deny set quietly stops denying. This workflow runs weekly with
# every suppression ignored and every optional check enabled, and files the
# result as an issue rather than a red badge on a cron nobody watches.
#
# It opens issues, so it holds `issues: write` — which is precisely why it is
# a separate file from the PR gate rather than another job inside it. A
# PR-triggered job must never be able to reach that permission.
name: leak-scan-strict

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: scheduled workflows queue
    # against everyone else's :00 cron.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leak-scan-strict
  cancel-in-progress: false

jobs:
  strict-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      REPO_AEGIS_ASSUME_PUBLIC: ${{ github.event.repository.private == false && '1' || '0' }}
      # An issue body is a publication channel. On a public repo it is
      # world-readable and indexed; engagement ids must not reach it.
      REPO_AEGIS_REDACT_ATTRIBUTION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '24'
      - name: Install repo-aegis
        # Installed from outside the checkout so a PR-supplied .npmrc
        # cannot repoint the registry, with scripts disabled and the
        # registry stated explicitly. See doc/github-action.md.
        working-directory: ${{ runner.temp }}
        env:
          REPO_AEGIS_VERSION: '0.8.2'
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g --ignore-scripts --registry=https://registry.npmjs.org \
            "@de-otio/repo-aegis@${REPO_AEGIS_VERSION}"
      - name: Strict audit
        id: audit
        # --ignore-allowlist-comments: report what `repo-aegis: allow` comments
        # are currently hiding from the day-to-day gate. --history sweeps the
        # full git log. There is no --ignore-waivers because `audit` never
        # applies waivers at all (unlike `check`) — it is already strict there.
        # Written to a file rather than a step output so no scanner-derived
        # text is ever interpolated into a later shell or expression.
        run: |
          set -o pipefail
          repo-aegis audit --json \
            --min-patterns 0 \
            --ignore-allowlist-comments \
            --history \
            --no-hooks-check \
            > "$RUNNER_TEMP/strict-audit.json" && rc=0 || rc=$?
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update the tracking issue
        if: steps.audit.outputs.exit-code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit-code }}
        with:
          script: |
            const fs = require('fs');
            const TITLE = 'repo-aegis: strict audit findings';
            // Read from disk, never from an expression: the payload contains
            // repo-derived paths and must not be spliced into anything.
            let raw = '';
            try {
              raw = fs.readFileSync(process.env.RUNNER_TEMP + '/strict-audit.json', 'utf8');
            } catch {
              raw = '(no JSON payload produced)';
            }
            const MAX = 55000;
            const body = [
              '## repo-aegis strict audit',
              '',
              'Ran with `--ignore-allowlist-comments --history`:',
              'this is what the day-to-day gate is currently suppressing.',
              '',
              'Exit code: `' + process.env.AUDIT_EXIT + '`',
              '',
              'Attribution is redacted — engagement ids are never published here.',
              'Re-run locally without `--redact-attribution` to see which',
              'engagement each finding belongs to.',
              '',
              '<details><summary>Findings (JSON)</summary>',
              '',
              '```json',
              raw.length > MAX ? raw.slice(0, MAX) + '\n... (truncated)' : raw,
              '```',
              '',
              '</details>',
              '',
              'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'repo-aegis',
            });
            const match = existing.data.find(i => i.title === TITLE);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                labels: ['repo-aegis'],
                body,
              });
            }
